<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Clients</title>
    <link rel="stylesheet" th:href="@{/styles/style.css}" href="../../static/styles/style.css">
    <link rel="icon" th:href="@{/images/icons/kinal-icon.png}" type="image/x-icon">
</head>

<body>
    <div class="main-wrapper">
        <nav class="sidebar">
            <ul class="list">
                <li class="sidebar-item"><a th:href="@{/home}"><svg xmlns="http://www.w3.org/2000/svg" height="64px"
                            viewBox="0 -960 960 960" width="64px" fill="#FFFFFF">
                            <path d="M359-242 120-481l239-239 43 43-166 166h604v60H236l166 166-43 43Z" />
                        </svg></a></li>
                <li class="sidebar-item"><a th:href="@{/home}"><svg xmlns="http://www.w3.org/2000/svg" height="64px"
                            viewBox="0 -960 960 960" width="64px" fill="#FFFFFF">
                            <path
                                d="M220-180h150v-250h220v250h150v-390L480-765 220-570v390Zm-60 60v-480l320-240 320 240v480H530v-250H430v250H160Zm320-353Z" />
                        </svg></a></li>
                <li class="sidebar-item">
                    <form class="logout" th:action="@{/logout}" method="post">
                        <button class="logout" type="submit">
                            <svg xmlns="http://www.w3.org/2000/svg" height="64px" viewBox="0 -960 960 960" width="64px"
                                fill="#FFFFFF">
                                <path
                                    d="M180-120q-24 0-42-18t-18-42v-600q0-24 18-42t42-18h299v60H180v600h299v60H180Zm486-185-43-43 102-102H360v-60h363L621-612l43-43 176 176-174 174Z" />
                            </svg>
                        </button>
                    </form>
                </li>
            </ul>
        </nav>
        <main class="clients-view">
            <h1 class="title">Clientes</h1>
            <h3 class="title">En esta vista usted puede crear nuevos clientes</h3>
            <form class="card" th:action="@{/view/clients/save}" th:object="${newClient}" method="post">
                <div class="card form">
                    <div class="container">
                        <label class="label" for="">DPI</label>
                        <input class="textfield" type="text" th:field="*{DPIClient}"
                            th:readonly="${newClient.DPIClient != null}"
                            th:style="${newClient.DPIClient != null} ? 'background-color: #e9e9e9; cursor: not-allowed;' : ''"
                            placeholder="1315464878152" required>
                    </div>
                    <div class="container">
                        <label class="label" for="">Nombre</label>
                        <input class="textfield" type="text" th:field="*{nameClient}" placeholder="Angel" name="name"
                            id="name" required>
                    </div>
                    <div class="container">
                        <label class="label" for="">Apellido</label>
                        <input class="textfield" type="text" th:field="*{lastNameClient}" placeholder="Alfaro"
                            name="lastName" id="lastName" required>
                    </div>
                    <div class="container">
                        <label class="label" for="">Dirección</label>
                        <input class="textfield" type="text" th:field="*{direction}" placeholder="Zona 7, Kaminal Juyu"
                            name="direction" id="direction" required>
                    </div>
                    <div class="container">
                        <label class="label" for="">Estado</label>
                        <input class="textfield" type="number" th:field="*{state}" placeholder="1" name="name"
                            id="name" required>
                    </div>
                </div>
                <button type="submit" class="btn">Añadir</button>
            </form>
            <form th:action="@{/view/clients/search}" method="get" class="card ">
                <input type="text" name="dpiSearch" class="textfield" placeholder="1512141684549" style="flex: 1;" required>
                <div class="actions">
                    <button type="submit" class="btn bg-green2">Buscar</button>
                    <a th:href="@{/view/clients}" class="btn bg-red2"
                        style="text-decoration: none; text-align: center;">Limpiar</a>
                </div>
            </form>

            <section class="clients">
                <article  th:each="client : ${clients}" class="card client bg-green">
                    <h3 class="title" th:text="'DPI: ' + ${client.DPIClient}"></h3>
                    <h3 class="title" th:text="'Nombre: ' + ${client.nameClient}"></h3>
                    <h3 class="title" th:text="'Apellido: ' + ${client.lastNameClient}"></h3>
                    <h3 class="title" th:text="'Direccion: ' + ${client.direction}"></h3>
                    <h3 class="title" th:text="'Estado: ' + ${client.state}"></h3>

                    <div sec:authorize="hasRole('ADMIN')" class="actions">
                        <a th:href="@{/view/clients/edit/{dpi}(dpi=${client.DPIClient})}"
                            class="btn bg-green2">Editar</a>
                        <a th:href="@{/view/clients/delete/{dpi}(dpi=${client.DPIClient})}"
                            class="btn bg-red2">Eliminar</a>
                    </div>
                </article>
            </section>
        </main>
    </div>
    <footer class="footer">
        <h3 class="title">@Copyright Angel Alfaro</h3>
    </footer>
</body>

</html>
